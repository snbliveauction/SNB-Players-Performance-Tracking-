<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* Layout: one column scoreboard, 760px max, dark single look taken from the club crest
   (ink navy, aqua, lime, cream). Header carries the crest. The leaderboard opens on a
   striped-pitch hero for the period's best player with a social card button, then a ranked
   list (wins first, goals break ties). Weeks run Saturday to Friday. */
:root {
  --gold: #E7C26A;
  color-scheme: dark;
  --bg: #0F151C;
  --bg-deep: #0B1117;
  --surface: #161E27;
  --surface-2: #1C2631;
  --line: #2A3644;
  --line-2: #3A4A5C;
  --ink: #ECE8D3;
  --muted: #94A4B1;
  --aqua: #7CC8CF;
  --aqua-ink: #08262A;
  --aqua-soft: #15323A;
  --lime: #A8CB45;
  --lime-soft: #232E17;
  --danger: #FF8F85;
  --danger-soft: #3A1F1F;
  --scrim: rgba(4, 8, 12, 0.74);
  --av-bg-l: 24%;
  --av-fg-l: 78%;
  --f-display: 'Anek Bangla', 'Hind Siliguri', system-ui, sans-serif;
  --f-body: 'Hind Siliguri', 'Anek Bangla', system-ui, sans-serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 20px 56px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.full { width: 100%; }
.small { font-size: 14px; }
.ic { display: inline-flex; }
.ic svg { width: 20px; height: 20px; }

/* header */
.top { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { flex: none; width: 68px; height: 68px; display: block; }
.brand-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.city { font-family: var(--f-num); font-weight: 700; font-size: 15px; letter-spacing: 0.32em; color: var(--lime); line-height: 1.1; }
.brand h1 { font-family: var(--f-num); font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; }
.eyebrow { font-size: 13px; letter-spacing: 0.03em; color: var(--muted); margin-top: 3px; }
.role { flex: none; align-self: flex-start; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: var(--muted); }
.role .who { color: var(--aqua); }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--aqua); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid transparent; background: var(--aqua); color: var(--aqua-ink); font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: var(--bg-deep); }
.btn.lime { background: var(--lime); color: #1A2406; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.block { width: 100%; }
input[type="text"], input[type="date"], input[type="email"], input[type="password"] {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 16px;
}
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
label.btn:focus-within { outline: 2px solid var(--aqua); outline-offset: 2px; }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 8px 16px; min-height: 40px; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-deep); }
.periodbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; }
.iconbtn:disabled { opacity: 0.3; cursor: not-allowed; }
.steplabel { min-width: 110px; text-align: center; font-size: 14px; color: var(--muted); }

/* avatar */
.av { --s: 44px; --h: 185; flex: none; width: var(--s); height: var(--s); border-radius: calc(var(--s) * 0.26); overflow: hidden; display: grid; place-items: center;
  background: hsl(var(--h) 30% var(--av-bg-l)); color: hsl(var(--h) 45% var(--av-fg-l)); font-family: var(--f-display); font-weight: 800; font-size: calc(var(--s) * 0.42); line-height: 1; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 18px; border: 1px solid var(--line-2); border-top: 3px solid var(--lime); display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(120% 90% at 100% 0%, rgba(124, 200, 207, 0.16), transparent 55%), repeating-linear-gradient(90deg, #141C26 0 44px, #111821 44px 88px); }
.kicker { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.04em; font-weight: 700; color: var(--lime); }
.hero-main { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.faces { display: flex; }
.faces .av { box-shadow: 0 0 0 3px var(--lime); }
.faces .av + .av { margin-left: -18px; }
.hero-info { min-width: 0; flex: 1 1 180px; display: flex; flex-direction: column; gap: 2px; }
.hero h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.hero .range { font-size: 14px; color: var(--muted); }
.hero-stats { display: flex; gap: 32px; }
.hero-stats div { display: flex; align-items: baseline; gap: 8px; }
.hero-stats b { font-family: var(--f-num); font-weight: 800; font-size: 60px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.hero-stats div:first-child b { color: var(--lime); }
.hero-stats div:last-child b { color: var(--aqua); }
.hero-stats span { font-size: 15px; color: var(--muted); }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero.empty { gap: 10px; }
.hero.empty h2 { font-size: 22px; }

/* ranked list */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.list { overflow: hidden; }
.lhead, .row { display: grid; grid-template-columns: 30px 44px minmax(0, 1fr) 38px 38px 42px; gap: 10px; align-items: center; padding: 10px 14px; }
.lhead { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.lhead span:nth-child(n+4) { text-align: right; }
.num { font-size: 24px; }
.row { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.rank { font-family: var(--f-num); font-weight: 700; font-size: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.first .rank { color: var(--lime); background: var(--lime-soft); border-radius: 8px; line-height: 30px; }
.nm { min-width: 0; }
.nm strong { display: block; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.nm .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; }
.nm .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--aqua), var(--lime)); }
.num { font-family: var(--f-num); font-weight: 700; font-size: 26px; text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
.num.dim { color: var(--muted); }

/* forms */
.panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel h2, .sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.3; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.chip span.t { min-width: 0; overflow-wrap: anywhere; font-weight: 500; line-height: 1.3; }
.chip[aria-pressed="true"] { border-color: var(--aqua); background: var(--aqua-soft); box-shadow: inset 0 0 0 1px var(--aqua); }
.goalrow { display: flex; align-items: center; gap: 14px; }
.goalnum { font-family: var(--f-num); font-weight: 800; font-size: 56px; line-height: 1; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; color: var(--lime); }
.goalrow .iconbtn { width: 48px; height: 48px; }
.fieldlbl { font-size: 14px; color: var(--muted); display: block; margin-bottom: 8px; }

.recent { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .grow strong { font-family: var(--f-display); font-weight: 700; overflow-wrap: anywhere; display: block; line-height: 1.3; }
.item .grow span { font-size: 14px; color: var(--muted); }
.goalpill { font-size: 14px; font-weight: 600; padding: 2px 10px; white-space: nowrap; border-radius: 8px; background: var(--aqua-soft); color: var(--aqua); }
.h3 { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.cardhead { padding: 14px 14px 4px; }

/* players grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pcard { padding: 0; overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.pcard .av { --s: 100%; width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; font-size: 56px; }
.pinfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pinfo strong { font-family: var(--f-display); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.pinfo span { font-size: 14px; color: var(--muted); }
.pcard.add { border-style: dashed; border-color: var(--line-2); align-items: center; justify-content: center; gap: 8px; min-height: 190px; padding: 16px; text-align: center; background: transparent; color: var(--aqua); font-family: var(--f-display); font-weight: 700; }
.pcard.add .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--aqua); color: var(--aqua-ink); display: grid; place-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); width: min(560px, 100%); max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 18px; max-height: 90%; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pro { display: flex; gap: 16px; align-items: center; }
.pro .av { --s: 104px; }
.pro h2 { font-size: 24px; overflow-wrap: anywhere; }
.pro .no { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.tbl td.n { font-family: var(--f-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.photorow { display: flex; align-items: center; gap: 14px; }
.photorow .av { --s: 88px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.preview { display: grid; place-items: center; min-height: 160px; background: var(--bg-deep); border-radius: 12px; padding: 12px; }
.preview img { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; border-radius: 8px; }

/* hall of fame, badges, install */
.tab { white-space: nowrap; padding-inline: 2px; }
.hall-card { overflow: hidden; }
.hall-card .cardhead { padding-bottom: 8px; }
.item.hrow { padding: 8px 10px 8px 14px; }
button.item { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
button.item:last-child { border-bottom: 0; }
.hallmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.hallmain .t { min-width: 0; display: flex; flex-direction: column; }
.hallmain .t strong { font-family: var(--f-display); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.hallmain .t span { font-size: 13px; color: var(--muted); }
.hallmain .t .when { color: var(--aqua); }
.tag { display: inline-block; font-size: 11px; padding: 0 7px; margin-left: 6px; border-radius: 6px; background: var(--lime-soft); color: var(--lime); vertical-align: middle; }
.trophies { font-family: var(--f-num); font-weight: 800; font-size: 22px; color: var(--lime); white-space: nowrap; }
.trank { font-family: var(--f-num); font-weight: 700; font-size: 20px; width: 22px; text-align: center; color: var(--muted); flex: none; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.badge .e { font-size: 26px; line-height: 1; flex: none; }
.badge .bt { min-width: 0; display: flex; flex-direction: column; }
.badge strong { font-family: var(--f-display); font-weight: 700; font-size: 14px; line-height: 1.25; }
.badge .d { font-size: 12px; color: var(--muted); line-height: 1.3; }
.badge.on { border-color: var(--lime); background: var(--lime-soft); }
.badge.off { opacity: 0.4; filter: grayscale(1); }
.mini { display: flex; gap: 3px; font-size: 14px; line-height: 1.2; margin-top: 2px; min-height: 17px; }
.install { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--aqua-soft); }
.install .e { font-size: 24px; flex: none; }
.install .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.install .grow strong { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.install .grow span { font-size: 13px; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.steps li { line-height: 1.5; }

/* draws */
.seg.kind { align-self: flex-start; }
.num.mid { color: var(--gold); }
.kindpill { font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 8px; white-space: nowrap; }
.kindpill.win { background: var(--lime-soft); color: var(--lime); }
.kindpill.draw { background: #33290F; color: var(--gold); }
.hero-stats div:nth-child(2) b { color: var(--gold); }
.hero-stats { gap: 22px; flex-wrap: wrap; }

/* search + login */
.searchbox { position: relative; }
.searchbox input { padding-right: 44px; }
.searchbox .clr { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 20px; }
.chips.scroll { max-height: 330px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px; }
.picked { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--aqua-soft); border: 1px solid var(--aqua); font-weight: 600; }
.cnt { font-size: 13px; color: var(--muted); margin-top: -6px; }
.lgform { display: flex; flex-direction: column; gap: 12px; }
.pwrow { position: relative; }
.pwrow input { padding-right: 76px; }
.pwrow .show { position: absolute; right: 6px; top: 6px; height: 32px; padding: 0 10px; border: 0; background: none; color: var(--aqua); font-weight: 700; font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; }
.sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.sep:before, .sep:after { content: ""; flex: 1; height: 1px; background: var(--line); }

.notice { padding: 14px 16px; border-radius: 12px; background: var(--lime-soft); color: var(--lime); font-size: 15px; }
.emptybox { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.emptybox h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg-deep); font-size: 15px; z-index: 30; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: pop 0.18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
@media (max-width: 420px) {
  .tab { font-size: 14px; }
  .lhead, .row { gap: 10px; padding-inline: 10px; grid-template-columns: 24px 40px minmax(0, 1fr) 30px 30px 34px; }
  .row .av { --s: 40px; }
  .hero h2 { font-size: 25px; }
  .hero-stats b { font-size: 50px; }
  .brand h1 { font-size: 30px; }
  .logo { width: 58px; height: 58px; }
}

/* ===== premium skin ===== */
:root {
  --bg: #0A1016; --bg-deep: #070C11; --surface: #141C26; --surface-2: #1A2430;
  --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.16);
  --gold-2: #F8E7AE; --gold-3: #B58B33;
  --grad-gold: linear-gradient(135deg, #F8E7AE 0%, #E7C26A 48%, #B58B33 100%);
  --grad-aqua: linear-gradient(135deg, #A9E4EA 0%, #7CC8CF 55%, #4FA3AD 100%);
  --shadow: 0 14px 36px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.05);
}
html { background: var(--bg-deep); }
body {
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(124,200,207,0.17), transparent 62%),

  }

  /* ---------- install as app ---------- */

  function loginSheet(closeBtn) {

  function authMsg(c) {
    if (c === 'auth/invalid-email') return 'ইমেইল ঠিক নয়।';

  async function init() {
