<!doctype html>
<html lang="bn">
<head>

<meta property="og:description" content="জয় ও গোলের স্কোরবোর্ড। সপ্তাহ ও মাসের সেরা প্লেয়ার।">

<meta property="og:url" content="https://netbreakers.pages.dev/">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Barlow+Condensed:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* Layout: one column scoreboard, 760px max, dark single look taken from the club crest
   (ink navy, aqua, lime, cream). Header carries the crest. The leaderboard opens on a
   striped-pitch hero for the period's best player with a social card button, then a ranked
   list (wins first, goals break ties). Weeks run Saturday to Friday. */
:root {
  color-scheme: dark;
  --bg: #0F151C;
  --bg-deep: #0B1117;
  --surface: #161E27;
  --surface-2: #1C2631;
  --line: #2A3644;
  --line-2: #3A4A5C;
  --ink: #ECE8D3;
  --muted: #94A4B1;
  --aqua: #7CC8CF;
  --aqua-ink: #08262A;
  --aqua-soft: #15323A;
  --lime: #A8CB45;
  --lime-soft: #232E17;
  --danger: #FF8F85;
  --danger-soft: #3A1F1F;
  --scrim: rgba(4, 8, 12, 0.74);
  --av-bg-l: 24%;
  --av-fg-l: 78%;
  --f-display: 'Anek Bangla', 'Hind Siliguri', system-ui, sans-serif;
  --f-body: 'Hind Siliguri', 'Anek Bangla', system-ui, sans-serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 20px 56px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.full { width: 100%; }
.small { font-size: 14px; }
.ic { display: inline-flex; }
.ic svg { width: 20px; height: 20px; }

/* header */
.top { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { flex: none; width: 68px; height: 68px; display: block; }
.brand-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.city { font-family: var(--f-num); font-weight: 700; font-size: 15px; letter-spacing: 0.32em; color: var(--lime); line-height: 1.1; }
.brand h1 { font-family: var(--f-num); font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; }
.eyebrow { font-size: 13px; letter-spacing: 0.03em; color: var(--muted); margin-top: 3px; }
.role { flex: none; align-self: flex-start; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: var(--muted); }
.role .who { color: var(--aqua); }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--aqua); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid transparent; background: var(--aqua); color: var(--aqua-ink); font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: var(--bg-deep); }
.btn.lime { background: var(--lime); color: #1A2406; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.block { width: 100%; }
input[type="text"], input[type="date"] {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 16px;
}
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
label.btn:focus-within { outline: 2px solid var(--aqua); outline-offset: 2px; }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 8px 16px; min-height: 40px; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-deep); }
.periodbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; }
.iconbtn:disabled { opacity: 0.3; cursor: not-allowed; }
.steplabel { min-width: 110px; text-align: center; font-size: 14px; color: var(--muted); }

/* avatar */
.av { --s: 44px; --h: 185; flex: none; width: var(--s); height: var(--s); border-radius: calc(var(--s) * 0.26); overflow: hidden; display: grid; place-items: center;
  background: hsl(var(--h) 30% var(--av-bg-l)); color: hsl(var(--h) 45% var(--av-fg-l)); font-family: var(--f-display); font-weight: 800; font-size: calc(var(--s) * 0.42); line-height: 1; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 18px; border: 1px solid var(--line-2); border-top: 3px solid var(--lime); display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(120% 90% at 100% 0%, rgba(124, 200, 207, 0.16), transparent 55%), repeating-linear-gradient(90deg, #141C26 0 44px, #111821 44px 88px); }
.kicker { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.04em; font-weight: 700; color: var(--lime); }
.hero-main { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.faces { display: flex; }
.faces .av { box-shadow: 0 0 0 3px var(--lime); }
.faces .av + .av { margin-left: -18px; }
.hero-info { min-width: 0; flex: 1 1 180px; display: flex; flex-direction: column; gap: 2px; }
.hero h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.hero .range { font-size: 14px; color: var(--muted); }
.hero-stats { display: flex; gap: 32px; }
.hero-stats div { display: flex; align-items: baseline; gap: 8px; }
.hero-stats b { font-family: var(--f-num); font-weight: 800; font-size: 60px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.hero-stats div:first-child b { color: var(--lime); }
.hero-stats div:last-child b { color: var(--aqua); }
.hero-stats span { font-size: 15px; color: var(--muted); }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero.empty { gap: 10px; }
.hero.empty h2 { font-size: 22px; }

/* ranked list */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.list { overflow: hidden; }
.lhead, .row { display: grid; grid-template-columns: 30px 44px minmax(0, 1fr) 42px 42px; gap: 12px; align-items: center; padding: 10px 14px; }
.lhead { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.lhead span:nth-child(n+4) { text-align: right; }
.row { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.rank { font-family: var(--f-num); font-weight: 700; font-size: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.first .rank { color: var(--lime); background: var(--lime-soft); border-radius: 8px; line-height: 30px; }
.nm { min-width: 0; }
.nm strong { display: block; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.nm .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; }
.nm .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--aqua), var(--lime)); }
.num { font-family: var(--f-num); font-weight: 700; font-size: 26px; text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
.num.dim { color: var(--muted); }

/* forms */
.panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel h2, .sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.3; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.chip span.t { min-width: 0; overflow-wrap: anywhere; font-weight: 500; line-height: 1.3; }
.chip[aria-pressed="true"] { border-color: var(--aqua); background: var(--aqua-soft); box-shadow: inset 0 0 0 1px var(--aqua); }
.goalrow { display: flex; align-items: center; gap: 14px; }
.goalnum { font-family: var(--f-num); font-weight: 800; font-size: 56px; line-height: 1; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; color: var(--lime); }
.goalrow .iconbtn { width: 48px; height: 48px; }
.fieldlbl { font-size: 14px; color: var(--muted); display: block; margin-bottom: 8px; }

.recent { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .grow strong { font-family: var(--f-display); font-weight: 700; overflow-wrap: anywhere; display: block; line-height: 1.3; }
.item .grow span { font-size: 14px; color: var(--muted); }
.goalpill { font-size: 14px; font-weight: 600; padding: 2px 10px; white-space: nowrap; border-radius: 8px; background: var(--aqua-soft); color: var(--aqua); }
.h3 { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.cardhead { padding: 14px 14px 4px; }

/* players grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pcard { padding: 0; overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.pcard .av { --s: 100%; width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; font-size: 56px; }
.pinfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pinfo strong { font-family: var(--f-display); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.pinfo span { font-size: 14px; color: var(--muted); }
.pcard.add { border-style: dashed; border-color: var(--line-2); align-items: center; justify-content: center; gap: 8px; min-height: 190px; padding: 16px; text-align: center; background: transparent; color: var(--aqua); font-family: var(--f-display); font-weight: 700; }
.pcard.add .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--aqua); color: var(--aqua-ink); display: grid; place-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); width: min(560px, 100%); max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 18px; max-height: 90%; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pro { display: flex; gap: 16px; align-items: center; }
.pro .av { --s: 104px; }
.pro h2 { font-size: 24px; overflow-wrap: anywhere; }
.pro .no { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.tbl td.n { font-family: var(--f-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.photorow { display: flex; align-items: center; gap: 14px; }
.photorow .av { --s: 88px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.preview { display: grid; place-items: center; min-height: 160px; background: var(--bg-deep); border-radius: 12px; padding: 12px; }
.preview img { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; border-radius: 8px; }

.notice { padding: 14px 16px; border-radius: 12px; background: var(--lime-soft); color: var(--lime); font-size: 15px; }
.emptybox { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.emptybox h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg-deep); font-size: 15px; z-index: 30; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: pop 0.18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
@media (max-width: 420px) {
  .lhead, .row { gap: 10px; padding-inline: 10px; grid-template-columns: 26px 40px minmax(0, 1fr) 36px 36px; }
  .row .av { --s: 40px; }
  .hero h2 { font-size: 25px; }
  .hero-stats b { font-size: 50px; }
  .brand h1 { font-size: 30px; }
  .logo { width: 58px; height: 58px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" id="logo" alt="Sylhet Net Breakers লোগো" width="68" height="68">
      <div class="brand-text">
        <p class="city">SYLHET</p>
        <h1>Net Breakers</h1>
        <p class="eyebrow">জয় ও গোলের হিসাব</p>
      </div>
      <span class="role" id="role"></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="বিভাগ" id="tabs"></nav>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function () {

  var fmtMonth = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' });

  var ICONS = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>'

      h('input', { type: 'text', id: 'pName', maxlength: '40', value: d.name, autocomplete: 'off', oninput: function (e) { S.draft.name = e.target.value; } })));
    wrap.append(h('label', { class: 'field' }, 'জার্সি নম্বর (ঐচ্ছিক)',
      h('input', { type: 'text', id: 'pNum', inputmode: 'numeric', maxlength: '3', value: d.number, autocomplete: 'off', oninput: function (e) { S.draft.number = e.target.value.replace(/\D/g, ''); } })));
    wrap.append(h('div', { class: 'actions' },
      h('button', { class: 'btn', disabled: d.busy, onclick: savePlayer }, d.busy ? 'সেভ হচ্ছে…' : 'সেভ করুন'),
      h('button', { class: 'btn ghost', onclick: function () { if (mode === 'edit') { S.sheet = { mode: 'profile', id: S.sheet.id }; renderSheet(); } else closeSheet(); } }, 'বাতিল')));
    return wrap;
  }
  function thumb(file, size) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('read')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error('image')); };
        img.onload = function () {
          var c = document.createElement('canvas'); c.width = c.height = size;
          var s = Math.min(img.width, img.height);
          var sx = (img.width - s) / 2, sy = (img.height - s) * 0.3;
          c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
          res(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  async function onPhoto(ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    try { S.draft.photo = await thumb(f, 400); renderSheet(); }
    catch (e) { toast('ছবিটি পড়া যায়নি, অন্য ছবি বাছুন।'); }
  }
  async function savePlayer() {
    var d = S.draft, name = d.name.trim();
    if (!name) { toast('নাম লিখুন'); var n = $('#pName'); if (n) n.focus(); return; }
    if (!S.db) return;
    d.busy = true; renderSheet();
    try {
      var data = { name: name, number: d.number.trim(), photo: d.photo || null };
      if (S.sheet.mode === 'new') {
        data.createdAt = Date.now();
        await S.db.collection('players').add(data);
        toast(name + ' যোগ হয়েছে');
        closeSheet();
      } else {
        var id = S.sheet.id;
        await S.db.doc('players/' + id).update(data);
        S.sheet = { mode: 'profile', id: id };
        renderSheet();
      }
    } catch (e) { d.busy = false; if (S.sheet) renderSheet(); writeFail(e); }
  }
  async function deletePlayer(id) {
    try {
      var months = {};
      S.wins.forEach(function (w) { if (w.playerId === id) months[w.month] = true; });
      var batch = S.db.batch();
      Object.keys(months).forEach(function (m) {
        var keep = S.wins.filter(function (w) { return w.month === m && w.playerId !== id; }).map(function (w) { return w.raw; });
        batch.set(S.db.doc('months/' + m), { entries: keep });
      });
      batch.delete(S.db.doc('players/' + id));
      await batch.commit();
      toast('প্লেয়ার মুছে ফেলা হয়েছে');
      closeSheet();
    } catch (e) { writeFail(e); }
  }

  /* ---------- social card ---------- */
  function loadImg(src) {
    return new Promise(function (res, rej) {
      var i = new Image();
      i.onload = function () { res(i); };
      i.onerror = function () { rej(new Error('img')); };
      i.src = src;
    });
  }
  function ensureFonts() {
    var f = ['800 80px "Barlow Condensed"', '700 40px "Barlow Condensed"', '800 60px "Anek Bangla"', '500 40px "Hind Siliguri"'];
    return Promise.all(f.map(function (x) { return document.fonts.load(x, 'Aa অআ'); })).catch(function () { /* fallback fonts */ });
  }
  function rr(x, px, py, w, hh, r) {
    x.beginPath();
    x.moveTo(px + r, py);
    x.arcTo(px + w, py, px + w, py + hh, r);
    x.arcTo(px + w, py + hh, px, py + hh, r);
    x.arcTo(px, py + hh, px, py, r);
    x.arcTo(px, py, px + w, py, r);
    x.closePath();
  }
  function bolt(x, cx, cy, sc, rot, alpha) {
    x.save();
    x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc);
    x.beginPath();
    x.moveTo(60, 0); x.lineTo(10, 110); x.lineTo(45, 110); x.lineTo(25, 200); x.lineTo(90, 80); x.lineTo(52, 80); x.lineTo(80, 0);
    x.closePath();
    x.fillStyle = 'rgba(168,203,69,' + alpha + ')';
    x.fill();
    x.restore();
  }
  function fitFont(x, txt, maxW, start, weight, family) {
    var px = start;
    x.font = weight + ' ' + px + 'px ' + family;
    while (x.measureText(txt).width > maxW && px > 30) { px -= 2; x.font = weight + ' ' + px + 'px ' + family; }
    return px;
  }
  async function drawCard(card) {
    var story = card.fmt === 'story';
    var W = 1080, H = story ? 1920 : 1350;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var x = cv.getContext('2d');
    var L = card.leaders[card.idx];
    var NUM = '"Barlow Condensed","Arial Narrow",sans-serif';
    var BN = '"Anek Bangla","Hind Siliguri",system-ui,sans-serif';

    var g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0B1117'); g.addColorStop(0.5, '#111A23'); g.addColorStop(1, '#0B1117');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (var i = 0; i < W; i += 88) { x.fillStyle = 'rgba(255,255,255,0.02)'; x.fillRect(i, 0, 44, H); }
    var rg = x.createRadialGradient(W / 2, H * 0.45, 40, W / 2, H * 0.45, W * 0.8);
    rg.addColorStop(0, 'rgba(124,200,207,0.20)'); rg.addColorStop(1, 'rgba(124,200,207,0)');
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
    bolt(x, 40, H * 0.46, 1.9, -0.25, 0.16);
    bolt(x, W - 40, H * 0.30, 1.6, 0.3, 0.12);
    x.fillStyle = '#A8CB45'; x.fillRect(0, 0, W, 10);

    var logoSize = story ? 420 : 300, logoY = story ? 100 : 36;
    try { var logo = await loadImg(LOGO); x.drawImage(logo, (W - logoSize) / 2, logoY, logoSize, logoSize); } catch (e) { /* skip logo */ }

    var kY = story ? 660 : 436, rY = story ? 728 : 492;
    var P = story ? 620 : 450, pY = story ? 800 : 536;
    var nY = story ? 1520 : 1066, sY = story ? 1708 : 1214, lY = story ? 1766 : 1264;
    x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    if ('letterSpacing' in x) x.letterSpacing = '4px';
    x.fillStyle = '#7CC8CF';
    fitFont(x, card.title, 940, story ? 108 : 96, 800, NUM);
    x.fillText(card.title, W / 2, kY);
    x.fillStyle = '#ECE8D3';
    fitFont(x, card.rangeTxt, 900, story ? 44 : 40, 600, NUM);
    x.fillText(card.rangeTxt, W / 2, rY);
    if ('letterSpacing' in x) x.letterSpacing = '0px';

    var px0 = (W - P) / 2;
    x.save(); rr(x, px0, pY, P, P, 44); x.clip();
    if (L.photo) {
      try { var im = await loadImg(L.photo); x.drawImage(im, px0, pY, P, P); }
      catch (e) { x.fillStyle = '#1C2631'; x.fillRect(px0, pY, P, P); }
    } else {
      x.fillStyle = '#1C2631'; x.fillRect(px0, pY, P, P);
      x.fillStyle = '#7CC8CF'; x.font = '800 ' + Math.round(P * 0.5) + 'px ' + BN;
      x.textBaseline = 'middle'; x.fillText(initial(L.name), W / 2, pY + P / 2 + 8); x.textBaseline = 'alphabetic';
    }
    x.restore();
    rr(x, px0, pY, P, P, 44); x.lineWidth = 10; x.strokeStyle = '#A8CB45'; x.stroke();

    x.fillStyle = '#ECE8D3';
    fitFont(x, L.name, 900, story ? 96 : 84, 800, BN);
    x.fillText(L.name, W / 2, nY);

    var cx1 = W * 0.3, cx2 = W * 0.7;
    x.fillStyle = '#A8CB45'; x.font = '800 ' + (story ? 170 : 140) + 'px ' + NUM; x.fillText(String(L.wins), cx1, sY);
    x.fillStyle = '#7CC8CF'; x.fillText(String(L.goals), cx2, sY);
    x.fillStyle = '#94A4B1'; x.font = '700 ' + (story ? 44 : 38) + 'px ' + NUM;
    if ('letterSpacing' in x) x.letterSpacing = '6px';
    x.fillText(L.wins === 1 ? 'WIN' : 'WINS', cx1, lY);
    x.fillText(L.goals === 1 ? 'GOAL' : 'GOALS', cx2, lY);
    if ('letterSpacing' in x) x.letterSpacing = '0px';
    x.fillStyle = '#3A4A5C'; x.fillRect(W / 2 - 1.5, sY - (story ? 120 : 100), 3, story ? 160 : 140);

    return new Promise(function (res, rej) {
      cv.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/png');
    });
  }
  function openCard(leaders) {
    var title = S.period === 'week' ? 'PLAYER OF THE WEEK' : S.period === 'month' ? 'PLAYER OF THE MONTH' : 'ALL-TIME BEST';
    var rs = range(S.period, S.offset);
    var key = S.period === 'all' ? 'all-time' : S.period + '-' + dateStr(new Date(rs.start));
    S.card = {
      leaders: leaders.map(function (r) { return { id: r.id, name: r.p.name, photo: r.p.photo || null, wins: r.wins, goals: r.goals }; }),
      idx: 0, fmt: 'post', title: title, rangeTxt: rangeLabelEn(S.period, S.offset), key: key,
      blob: null, url: null, loading: false, err: false
    };
    S.sheet = { mode: 'card', id: null };
    renderSheet();
    $('#scrim').hidden = false;
    buildCard();
  }
  async function buildCard() {
    var c = S.card; if (!c) return;
    c.loading = true; c.err = false; renderSheet();
    try {
      await ensureFonts();
      var blob = await drawCard(c);
      if (S.card !== c) return;
      if (c.url) { try { URL.revokeObjectURL(c.url); } catch (e) { /* ignore */ } }
      c.blob = blob; c.url = URL.createObjectURL(blob);
    } catch (e) { console.error(e); c.err = true; }
    c.loading = false;
    if (S.card === c && S.sheet && S.sheet.mode === 'card') renderSheet();
  }
  function cardSheet(closeBtn) {
    var c = S.card, wrap = h('div', { class: 'form' });
    wrap.append(h('div', { class: 'sheet-head' }, h('h2', null, 'সোশ্যাল মিডিয়া কার্ড'), closeBtn));
    if (c.leaders.length > 1) {
      var chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'কার কার্ড' });
      c.leaders.forEach(function (l, i) {
        chips.append(h('button', { class: 'chip', 'aria-pressed': c.idx === i ? 'true' : 'false', onclick: function () { c.idx = i; buildCard(); } },
          avatar(l, 40), h('span', { class: 't' }, l.name)));
      });
      wrap.append(chips);
    }
    wrap.append(h('div', null, h('div', { class: 'seg', role: 'group', 'aria-label': 'কার্ডের মাপ' },
      h('button', { 'aria-pressed': c.fmt === 'post' ? 'true' : 'false', onclick: function () { if (c.fmt !== 'post') { c.fmt = 'post'; buildCard(); } } }, 'পোস্ট 4:5'),
      h('button', { 'aria-pressed': c.fmt === 'story' ? 'true' : 'false', onclick: function () { if (c.fmt !== 'story') { c.fmt = 'story'; buildCard(); } } }, 'স্টোরি 9:16'))));
    var pv = h('div', { class: 'preview' });
    if (c.loading) pv.append(h('p', { class: 'muted' }, 'কার্ড তৈরি হচ্ছে…'));
    else if (c.err) pv.append(h('p', { class: 'muted' }, 'কার্ড বানানো যায়নি, আবার চেষ্টা করুন।'));
    else if (c.url) pv.append(h('img', { src: c.url, alt: c.title + ': ' + c.leaders[c.idx].name }));
    wrap.append(pv);
    wrap.append(h('div', { class: 'actions' },
      h('button', { class: 'btn', disabled: !c.blob || c.loading, onclick: saveCard }, icon('down'), 'PNG ডাউনলোড'),
      canShareFiles() ? h('button', { class: 'btn ghost', disabled: !c.blob || c.loading, onclick: shareCard }, 'শেয়ার করুন') : null));
    wrap.append(h('p', { class: 'muted small' }, 'ডাউনলোড না হলে ছবিটি চেপে ধরে ফোনে সেভ করুন, তারপর ফেসবুক বা ইনস্টাগ্রামে পোস্ট করুন।'));
    return wrap;
  }
  function cardName() { var c = S.card; return 'net-breakers-' + c.key + '-' + c.fmt + '.png'; }
  function saveCard() {
    var c = S.card; if (!c || !c.url) return;
    var a = document.createElement('a');
    a.href = c.url; a.download = cardName();
    document.body.appendChild(a); a.click(); a.remove();
    toast('ডাউনলোড শুরু হয়েছে');
  }
  async function shareCard() {
    var c = S.card; if (!c || !c.blob) return;
    try { await navigator.share({ files: [new File([c.blob], cardName(), { type: 'image/png' })] }); }
    catch (e) { /* cancelled */ }
  }
  function canShareFiles() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.png', { type: 'image/png' })] })); } catch (e) { return false; }
  }

  /* ---------- render ---------- */
  function renderView() {
    var v = $('#view');
    v.textContent = '';
    if (S.noDb) {
      v.append(h('div', { class: 'notice' }, 'সাইটের সেটআপ শেষ হয়নি। public/config.js ফাইলে Firebase এর তথ্য বসিয়ে আবার deploy করুন।'));
      return;
    }
    if (!(S.loaded.p && S.loaded.w)) { v.append(h('p', { class: 'muted' }, 'লোড হচ্ছে…')); return; }
    v.append(S.tab === 'board' ? viewBoard() : S.tab === 'add' ? viewAdd() : viewPlayers());
  }
  function refresh() {
    if (!S.canWrite && S.tab === 'add') S.tab = 'board';
    renderHeader();
    renderTabs();
    renderView();
    if (S.sheet && S.sheet.mode === 'profile') renderSheet();
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(); });
  $('#scrim').addEventListener('click', function (e) { if (e.target === e.currentTarget) closeSheet(); });

  /* ---------- data ---------- */
  function listen() {
    var db = S.db;
    db.collection('players').onSnapshot(function (snap) {
      S.players = new Map(snap.docs.map(function (d) { return [d.id, d.data()]; }));
      S.loaded.p = true; refresh();
    }, function (e) { console.error(e); S.loaded.p = true; refresh(); });
    db.collection('months').onSnapshot(function (snap) {
      var out = [];
      snap.docs.forEach(function (d) {
        (d.data().entries || []).forEach(function (x) {
          out.push({ id: x.id, playerId: x.playerId, goals: Number(x.goals) || 0, ts: Number(x.ts) || 0, createdAt: Number(x.createdAt) || 0, month: d.id, raw: x });
        });
      });
      S.wins = out;
      S.loaded.w = true; refresh();
    }, function (e) { console.error(e); S.loaded.w = true; refresh(); });
  }
  async function login() {
    var provider = new firebase.auth.GoogleAuthProvider();
    try { await S.auth.signInWithPopup(provider); }
    catch (e) {
      var c = e && e.code;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { S.auth.signInWithRedirect(provider); return; }
      if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      console.error(e); toast('লগইন হয়নি, আবার চেষ্টা করুন।');
    }
  }
  function logout() { S.auth.signOut(); }
  async function init() {
    $('#logo').src = LOGO;
    renderHeader(); renderTabs(); renderView();
    var cfg = window.NB_CONFIG && window.NB_CONFIG.firebase;
    if (!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('PASTE') === 0) {
      S.noDb = true; S.setup = true; renderHeader(); renderView(); return;
    }
    firebase.initializeApp(cfg);
    S.db = firebase.firestore();
    try { await S.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* cache unavailable, fine */ }
    S.auth = firebase.auth();
    listen();
    S.auth.onAuthStateChanged(async function (u) {
      S.user = u; S.canWrite = false;
      if (u && u.email) {
        try { var a = await S.db.doc('admins/' + u.email).get(); S.canWrite = a.exists; } catch (e) { S.canWrite = false; }
        if (!S.canWrite) toast('এই ইমেইল অ্যাডমিন তালিকায় নেই।');
      }
      refresh();
    });
  }
  init();
})();
</script>
</body>
