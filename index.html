<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* Layout: one column scoreboard, 760px max, dark single look taken from the club crest
   (ink navy, aqua, lime, cream). Header carries the crest. The leaderboard opens on a
   striped-pitch hero for the period's best player with a social card button, then a ranked
   list (wins first, goals break ties). Weeks run Saturday to Friday. */
:root {
  --gold: #E7C26A;
  color-scheme: dark;
  --bg: #0F151C;
  --bg-deep: #0B1117;
  --surface: #161E27;
  --surface-2: #1C2631;
  --line: #2A3644;
  --line-2: #3A4A5C;
  --ink: #ECE8D3;
  --muted: #94A4B1;
  --aqua: #7CC8CF;
  --aqua-ink: #08262A;
  --aqua-soft: #15323A;
  --lime: #A8CB45;
  --lime-soft: #232E17;
  --danger: #FF8F85;
  --danger-soft: #3A1F1F;
  --scrim: rgba(4, 8, 12, 0.74);
  --av-bg-l: 24%;
  --av-fg-l: 78%;
  --f-display: 'Anek Bangla', 'Hind Siliguri', system-ui, sans-serif;
  --f-body: 'Hind Siliguri', 'Anek Bangla', system-ui, sans-serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 20px 56px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
.wrap { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); }
.full { width: 100%; }
.small { font-size: 14px; }
.ic { display: inline-flex; }
.ic svg { width: 20px; height: 20px; }

/* header */
.top { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { flex: none; width: 68px; height: 68px; display: block; }
.brand-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.city { font-family: var(--f-num); font-weight: 700; font-size: 15px; letter-spacing: 0.32em; color: var(--lime); line-height: 1.1; }
.brand h1 { font-family: var(--f-num); font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; }
.eyebrow { font-size: 13px; letter-spacing: 0.03em; color: var(--muted); margin-top: 3px; }
.role { flex: none; align-self: flex-start; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: var(--muted); }
.role .who { color: var(--aqua); }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--muted); margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--aqua); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid transparent; background: var(--aqua); color: var(--aqua-ink); font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--ink); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: var(--bg-deep); }
.btn.lime { background: var(--lime); color: #1A2406; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn.block { width: 100%; }
input[type="text"], input[type="date"], input[type="email"], input[type="password"] {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 16px;
}
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
label.btn:focus-within { outline: 2px solid var(--aqua); outline-offset: 2px; }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 8px 16px; min-height: 40px; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg-deep); }
.periodbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; }
.iconbtn:disabled { opacity: 0.3; cursor: not-allowed; }
.steplabel { min-width: 110px; text-align: center; font-size: 14px; color: var(--muted); }

/* avatar */
.av { --s: 44px; --h: 185; flex: none; width: var(--s); height: var(--s); border-radius: calc(var(--s) * 0.26); overflow: hidden; display: grid; place-items: center;
  background: hsl(var(--h) 30% var(--av-bg-l)); color: hsl(var(--h) 45% var(--av-fg-l)); font-family: var(--f-display); font-weight: 800; font-size: calc(var(--s) * 0.42); line-height: 1; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 18px; padding: 18px; border: 1px solid var(--line-2); border-top: 3px solid var(--lime); display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(120% 90% at 100% 0%, rgba(124, 200, 207, 0.16), transparent 55%), repeating-linear-gradient(90deg, #141C26 0 44px, #111821 44px 88px); }
.kicker { font-family: var(--f-display); font-size: 14px; letter-spacing: 0.04em; font-weight: 700; color: var(--lime); }
.hero-main { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.faces { display: flex; }
.faces .av { box-shadow: 0 0 0 3px var(--lime); }
.faces .av + .av { margin-left: -18px; }
.hero-info { min-width: 0; flex: 1 1 180px; display: flex; flex-direction: column; gap: 2px; }
.hero h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
.hero .range { font-size: 14px; color: var(--muted); }
.hero-stats { display: flex; gap: 32px; }
.hero-stats div { display: flex; align-items: baseline; gap: 8px; }
.hero-stats b { font-family: var(--f-num); font-weight: 800; font-size: 60px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.hero-stats div:first-child b { color: var(--lime); }
.hero-stats div:last-child b { color: var(--aqua); }
.hero-stats span { font-size: 15px; color: var(--muted); }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero.empty { gap: 10px; }
.hero.empty h2 { font-size: 22px; }

/* ranked list */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.list { overflow: hidden; }
.lhead, .row { display: grid; grid-template-columns: 30px 44px minmax(0, 1fr) 34px 34px 34px 40px; gap: 10px; align-items: center; padding: 10px 14px; }
.lhead { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.lhead span:nth-child(n+4) { text-align: right; }
.num { font-size: 24px; }
.row { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.rank { font-family: var(--f-num); font-weight: 700; font-size: 24px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.first .rank { color: var(--lime); background: var(--lime-soft); border-radius: 8px; line-height: 30px; }
.nm { min-width: 0; }
.nm strong { display: block; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.3; overflow-wrap: anywhere; }
.nm .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; }
.nm .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--aqua), var(--lime)); }
.num { font-family: var(--f-num); font-weight: 700; font-size: 26px; text-align: right; line-height: 1; font-variant-numeric: tabular-nums; }
.num.dim { color: var(--muted); }

/* forms */
.panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel h2, .sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.3; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.chip span.t { min-width: 0; overflow-wrap: anywhere; font-weight: 500; line-height: 1.3; }
.chip[aria-pressed="true"] { border-color: var(--aqua); background: var(--aqua-soft); box-shadow: inset 0 0 0 1px var(--aqua); }
.goalrow { display: flex; align-items: center; gap: 14px; }
.goalnum { font-family: var(--f-num); font-weight: 800; font-size: 56px; line-height: 1; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; color: var(--lime); }
.goalrow .iconbtn { width: 48px; height: 48px; }
.fieldlbl { font-size: 14px; color: var(--muted); display: block; margin-bottom: 8px; }

.recent { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .grow strong { font-family: var(--f-display); font-weight: 700; overflow-wrap: anywhere; display: block; line-height: 1.3; }
.item .grow span { font-size: 14px; color: var(--muted); }
.goalpill { font-size: 14px; font-weight: 600; padding: 2px 10px; white-space: nowrap; border-radius: 8px; background: var(--aqua-soft); color: var(--aqua); }
.h3 { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.cardhead { padding: 14px 14px 4px; }

/* players grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pcard { padding: 0; overflow: hidden; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.pcard .av { --s: 100%; width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; font-size: 56px; }
.pinfo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pinfo strong { font-family: var(--f-display); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.pinfo span { font-size: 14px; color: var(--muted); }
.pcard.add { border-style: dashed; border-color: var(--line-2); align-items: center; justify-content: center; gap: 8px; min-height: 190px; padding: 16px; text-align: center; background: transparent; color: var(--aqua); font-family: var(--f-display); font-weight: 700; }
.pcard.add .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--aqua); color: var(--aqua-ink); display: grid; place-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); width: min(560px, 100%); max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 16px; } .sheet { border-radius: 18px; max-height: 90%; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pro { display: flex; gap: 16px; align-items: center; }
.pro .av { --s: 104px; }
.pro h2 { font-size: 24px; overflow-wrap: anywhere; }
.pro .no { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.tbl td.n { font-family: var(--f-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.photorow { display: flex; align-items: center; gap: 14px; }
.photorow .av { --s: 88px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.preview { display: grid; place-items: center; min-height: 160px; background: var(--bg-deep); border-radius: 12px; padding: 12px; }
.preview img { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; border-radius: 8px; }

/* hall of fame, badges, install */
.tab { white-space: nowrap; padding-inline: 2px; }
.hall-card { overflow: hidden; }
.hall-card .cardhead { padding-bottom: 8px; }
.item.hrow { padding: 8px 10px 8px 14px; }
button.item { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
button.item:last-child { border-bottom: 0; }
.hallmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.hallmain .t { min-width: 0; display: flex; flex-direction: column; }
.hallmain .t strong { font-family: var(--f-display); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.hallmain .t span { font-size: 13px; color: var(--muted); }
.hallmain .t .when { color: var(--aqua); }
.tag { display: inline-block; font-size: 11px; padding: 0 7px; margin-left: 6px; border-radius: 6px; background: var(--lime-soft); color: var(--lime); vertical-align: middle; }
.trophies { font-family: var(--f-num); font-weight: 800; font-size: 22px; color: var(--lime); white-space: nowrap; }
.trank { font-family: var(--f-num); font-weight: 700; font-size: 20px; width: 22px; text-align: center; color: var(--muted); flex: none; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.badge .e { font-size: 26px; line-height: 1; flex: none; }
.badge .bt { min-width: 0; display: flex; flex-direction: column; }
.badge strong { font-family: var(--f-display); font-weight: 700; font-size: 14px; line-height: 1.25; }
.badge .d { font-size: 12px; color: var(--muted); line-height: 1.3; }
.badge.on { border-color: var(--lime); background: var(--lime-soft); }
.badge.off { opacity: 0.4; filter: grayscale(1); }
.mini { display: flex; gap: 3px; font-size: 14px; line-height: 1.2; margin-top: 2px; min-height: 17px; }
.install { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--aqua-soft); }
.install .e { font-size: 24px; flex: none; }
.install .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.install .grow strong { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.install .grow span { font-size: 13px; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.steps li { line-height: 1.5; }

/* draws */
.seg.kind { align-self: flex-start; }
.num.mid { color: var(--gold); }
.kindpill { font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 8px; white-space: nowrap; }
.kindpill.win { background: var(--lime-soft); color: var(--lime); }
.kindpill.draw { background: #33290F; color: var(--gold); }
.kindpill.loss { background: #3A1B1B; color: #F08A80; }
.num.loss { color: #E8776B; }
.hero-stats div:nth-child(2) b { color: var(--gold); }
.hero-stats { gap: 22px; flex-wrap: wrap; }

/* search + login */
.searchbox { position: relative; }
.searchbox input { padding-right: 44px; }
.searchbox .clr { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 20px; }
.chips.scroll { max-height: 330px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px; }
.picked { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--aqua-soft); border: 1px solid var(--aqua); font-weight: 600; }
.cnt { font-size: 13px; color: var(--muted); margin-top: -6px; }
.lgform { display: flex; flex-direction: column; gap: 12px; }
.pwrow { position: relative; }
.pwrow input { padding-right: 76px; }
.pwrow .show { position: absolute; right: 6px; top: 6px; height: 32px; padding: 0 10px; border: 0; background: none; color: var(--aqua); font-weight: 700; font-size: 14px; }
.err { color: var(--danger); font-size: 14px; min-height: 20px; }
.sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.sep:before, .sep:after { content: ""; flex: 1; height: 1px; background: var(--line); }

.notice { padding: 14px 16px; border-radius: 12px; background: var(--lime-soft); color: var(--lime); font-size: 15px; }
.emptybox { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.emptybox h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg-deep); font-size: 15px; z-index: 30; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: pop 0.18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
}
@media (max-width: 420px) {
  .tab { font-size: 14px; }
  .lhead, .row { gap: 10px; padding-inline: 10px; grid-template-columns: 22px 38px minmax(0, 1fr) 26px 26px 26px 32px; }
  .row .av { --s: 40px; }
  .hero h2 { font-size: 25px; }
  .hero-stats b { font-size: 50px; }
  .brand h1 { font-size: 30px; }
  .logo { width: 58px; height: 58px; }
}

/* ===== premium skin ===== */
:root {
  --bg: #0A1016; --bg-deep: #070C11; --surface: #141C26; --surface-2: #1A2430;
  --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.16);
  --gold-2: #F8E7AE; --gold-3: #B58B33;
  --grad-gold: linear-gradient(135deg, #F8E7AE 0%, #E7C26A 48%, #B58B33 100%);
  --grad-aqua: linear-gradient(135deg, #A9E4EA 0%, #7CC8CF 55%, #4FA3AD 100%);
  --shadow: 0 14px 36px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.05);
}
html { background: var(--bg-deep); }
body {
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(124,200,207,0.17), transparent 62%),
    radial-gradient(700px 520px at -12% 6%, rgba(168,203,69,0.10), transparent 60%),
    radial-gradient(800px 600px at 50% 110%, rgba(231,194,106,0.07), transparent 60%),
    linear-gradient(180deg, #0B121A, #070C11);
  background-repeat: no-repeat; min-height: 100vh;
}
.top { padding: 14px 14px 0; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); box-shadow: var(--shadow); gap: 10px; }

.logo { box-sizing: border-box; padding: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #22404E, #0A1319); box-shadow: 0 0 0 2px #E7C26A, 0 8px 20px rgba(0,0,0,0.4); object-fit: contain; }
.city { background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 0.42em; }
.brand h1 { background: linear-gradient(180deg, #FFFFFF 10%, #CFE9EB 60%, #8FC9D0 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
.tabs { border: 0; background: rgba(0,0,0,0.28); border-radius: 14px; padding: 4px; gap: 2px; margin: 0 -2px 12px; }
.tab { border: 0; margin: 0; border-radius: 10px; padding: 9px 2px; transition: background .2s, color .2s; }
.tab[aria-selected="true"] { color: #08262A; background: var(--grad-aqua); box-shadow: 0 4px 14px rgba(124,200,207,0.35); }
.card { background: linear-gradient(180deg, #19222D 0%, #141C26 100%); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.btn { background: var(--grad-aqua); box-shadow: 0 6px 18px rgba(124,200,207,0.25); border-radius: 12px; letter-spacing: 0.01em; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: rgba(255,255,255,0.04); box-shadow: none; }
.btn.danger { box-shadow: none; background: var(--danger-soft); }
.btn.danger-solid { background: var(--danger); box-shadow: none; }
.btn.lime { background: linear-gradient(135deg,#C4E26A,#A8CB45); }
.seg { border-radius: 12px; background: rgba(0,0,0,0.28); border-color: var(--line); padding: 3px; gap: 2px; }
.seg button { border-radius: 9px; }
.seg button[aria-pressed="true"] { background: var(--grad-gold); color: #2A1E05; box-shadow: 0 3px 10px rgba(231,194,106,0.3); }
.iconbtn { background: rgba(255,255,255,0.05); border-color: var(--line); }
select { width: 100%; font: inherit; color: var(--ink); padding: 12px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(0,0,0,0.3); }
select option { color: #111; }
input[type="text"], input[type="date"], input[type="email"], input[type="password"] { background: rgba(0,0,0,0.3); border-color: var(--line-2); border-radius: 12px; }
input:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(124,200,207,0.22); }

/* hero */
.hero { border: 1px solid rgba(231,194,106,0.28); border-top: 0; border-radius: 22px; padding: 22px 18px 18px; box-shadow: 0 18px 44px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset;
  background: radial-gradient(110% 80% at 85% -10%, rgba(231,194,106,0.20), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(124,200,207,0.14), transparent 60%), repeating-linear-gradient(90deg, #141D27 0 44px, #111A23 44px 88px); }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--lime), var(--gold), var(--aqua)); }
.kicker { display: inline-flex; align-self: flex-start; padding: 3px 12px; border-radius: 999px; background: var(--grad-gold); color: #2A1E05; font-weight: 800; letter-spacing: 0.02em; }
.crownwrap { position: relative; padding-top: 22px; }
.crown { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); font-size: 30px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(231,194,106,0.6)); z-index: 2; }
.faces .av { box-shadow: 0 0 0 3px #E7C26A, 0 0 0 7px rgba(231,194,106,0.22), 0 12px 30px rgba(0,0,0,0.5); }
.hero h2 { background: linear-gradient(180deg, #FFFFFF, #E9E2C8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-stats { gap: 10px; }
.hero-stats div { flex: 1 1 0; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 12px 10px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); min-width: 0; }
.hero-stats b { font-size: 52px; }
.hero-stats span { font-size: 13px; letter-spacing: 0.08em; }
.hero-stats div:first-child b { color: var(--lime); }
.hero-stats div:nth-child(2) b { color: var(--gold); }
.hero-stats div:last-child b { color: var(--aqua); }

/* leaderboard */
.list { border-radius: 20px; }
.lhead { background: rgba(0,0,0,0.25); }
.row { transition: background .15s; }
.row:hover { background: rgba(255,255,255,0.04); }
.rank { font-size: 22px; }
.row.first { background: linear-gradient(90deg, rgba(231,194,106,0.14), transparent 70%); }
.row.m1 .rank, .row.m2 .rank, .row.m3 .rank { color: #1B1305; border-radius: 50%; width: 30px; height: 30px; line-height: 30px; font-size: 18px; margin-inline: auto; box-shadow: 0 3px 10px rgba(0,0,0,0.4); }
.row.m1 .rank { background: var(--grad-gold); }
.row.m2 .rank { background: linear-gradient(135deg, #F4F7FA, #8393A3); }
.row.m3 .rank { background: linear-gradient(135deg, #F0B48A, #9A5A32); }
.row.m1 .av { box-shadow: 0 0 0 2px #E7C26A; }
.nm .bar { height: 5px; background: rgba(255,255,255,0.08); }
.nm .bar i { background: linear-gradient(90deg, var(--aqua), var(--lime)); box-shadow: 0 0 10px rgba(168,203,69,0.45); }
.num { font-size: 24px; }

/* chips, sheets, pills */
.chip { background: rgba(255,255,255,0.03); border-radius: 14px; }
.chip[aria-pressed="true"] { background: rgba(124,200,207,0.14); }
.picked { background: rgba(124,200,207,0.12); }
.goalnum { background: linear-gradient(180deg, #D7EE85, #A8CB45); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sheet { background: linear-gradient(180deg, #19222D, #121A23); border-color: var(--line-2); box-shadow: 0 -20px 60px rgba(0,0,0,0.55); }
.scrim { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.badge.on { background: linear-gradient(135deg, rgba(168,203,69,0.18), rgba(231,194,106,0.10)); border-color: rgba(231,194,106,0.55); }
.pcard { transition: transform .15s; }
.pcard:active { transform: scale(0.98); }
.install { background: linear-gradient(135deg, rgba(124,200,207,0.16), rgba(231,194,106,0.08)); border-radius: 16px; }
.toast { background: var(--grad-gold); color: #2A1E05; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
.emptybox { border-style: dashed; }
@media (prefers-reduced-motion: no-preference) {
  .stack > * { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  .stack > *:nth-child(2) { animation-delay: .06s; }
  .stack > *:nth-child(3) { animation-delay: .12s; }
  .crown { animation: bob 3s ease-in-out infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -3px); } }
}
@media (max-width: 420px) {
  .hero-stats b { font-size: 44px; }
  .top { padding: 12px 12px 0; }
}

/* fun */
.tab.funtab { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.funic { display: inline-flex; filter: drop-shadow(0 0 5px rgba(231,194,106,0.55)); }
.tab.funtab:not([aria-selected="true"]) span:last-child { background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
.tab[aria-selected="true"].funtab .funic { filter: none; }
.tab[aria-selected="true"].funtab path { fill: #08262A; }
.qtext { font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--gold); }
.ttl { display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--gold); line-height: 1.3; margin-top: 1px; }
.pro .ttl { font-size: 15px; margin-top: 4px; }
.nm .ttl { display: block; margin-top: 0; }
.tabs .tab { font-size: 14px; }
@media (max-width: 480px) { .tabs .tab { font-size: 12.5px; padding-left: 3px; padding-right: 3px; white-space: nowrap; } .tabs .funic { display: none; } }
.chips2 { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.chip2 { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255,255,255,0.04); font-size: 14px; white-space: nowrap; }
.chip2[aria-pressed="true"] { background: var(--grad-gold); color: #2A1E05; border-color: transparent; font-weight: 700; }
.wheelwrap { display: grid; place-items: center; }
.wheel { width: min(100%, 360px); height: auto; aspect-ratio: 1; }
.winrow { display: flex; align-items: center; gap: 14px; }
.winrow h2 { font-size: 24px; }
.sel { width: 100%; min-height: 40px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(0,0,0,0.3); color: var(--ink); font: inherit; font-size: 15px; }
.cmphead { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
.cmpside { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.vs { align-self: center; font-family: var(--f-num); font-weight: 800; font-size: 26px; color: var(--gold); }
.cmp { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cmprow { display: grid; grid-template-columns: 1fr 1.6fr 1fr; align-items: center; text-align: center; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.cmprow:last-child { border-bottom: 0; }
.cmprow span { font-size: 13px; color: var(--muted); }
.cmprow b { font-family: var(--f-num); font-size: 26px; font-weight: 800; color: var(--muted); }
.cmprow b.win { color: var(--lime); }
.verdict { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--gold); }
.vres { display: flex; flex-direction: column; }
.vrow { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.vrow:last-child { border-bottom: 0; }
.vrow.mine { background: rgba(124,200,207,0.1); border-radius: 10px; }
.vrow .grow { flex: 1; min-width: 0; }
.vrow strong { font-family: var(--f-display); display: block; line-height: 1.3; }
.vrow .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 4px; }
.vrow .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--aqua), var(--gold)); }

.periodbar:has(.funseg) { display: block; }
.funseg { display: flex; overflow-x: auto; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.funseg::-webkit-scrollbar { display: none; }
.funseg button { white-space: nowrap; padding: 8px 13px; flex: 0 0 auto; }
.tcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.tcard { border: 0; border-radius: 16px; padding: 10px 6px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--f-display); cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,0.3); min-width: 0; }
.tcard .r { font-size: 28px; font-weight: 800; line-height: 1; }
.tcard .tn { font-size: 10px; letter-spacing: 0.16em; font-weight: 800; opacity: 0.8; }
.tcard .nm { font-weight: 800; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcard.bronze { background: linear-gradient(160deg, #F5CFA6, #C98954 60%, #955629); color: #2F1A08; }
.tcard.silver { background: linear-gradient(160deg, #F7F9FB, #C8D0D9 60%, #8C97A4); color: #1E2833; }
.tcard.gold { background: linear-gradient(160deg, #FBEBB8, #E7C26A 55%, #B88A2C); color: #2A1E05; }
.tcard.legend { background: linear-gradient(160deg, #4B3A9C, #233C9A 60%, #101C54); color: #FFEFB8; box-shadow: 0 6px 20px rgba(110,90,230,0.45); }
.tierline { margin: 8px 0 0; }
.gwrap { display: flex; justify-content: center; margin: 12px 0 8px; }
.gcv { width: min(320px, 100%); aspect-ratio: 1; border-radius: 20px; border: 3px solid #E7C26A; background: #10222B; }
.gbarw { height: 8px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 12px; }
.gbarw i { display: block; height: 100%; width: 100%; background: var(--grad-gold); }
.gopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.gopt { min-height: 48px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(255,255,255,0.05); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 16px; padding: 8px; }
.gopt.ok { background: #2E8B57; border-color: #2E8B57; color: #fff; }
.gopt.bad { background: #B8433A; border-color: #B8433A; color: #fff; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pchips .chip.on { outline: 2px solid #E7C26A; background: rgba(231,194,106,0.18); }
.moment { padding: 0; overflow: hidden; }
.moment img { display: block; width: 100%; aspect-ratio: 4 / 3; height: auto; max-height: 520px; object-fit: cover; background: #0C1A22; }
.moment .mbody { padding: 12px 14px 14px; }
.moment.best { outline: 2px solid #E7C26A; }
.dream .seg { margin: 6px 0; }
.pitch { margin: 8px 0; padding: 14px 6px; border-radius: 18px; background: linear-gradient(180deg, #1E6B3E, #0F4A2A); border: 2px solid rgba(255,255,255,0.35); display: flex; flex-direction: column; gap: 14px; position: relative; }
.pitch::before { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; border-top: 2px solid rgba(255,255,255,0.25); }
.prow { display: flex; justify-content: space-around; align-items: flex-start; position: relative; }
.pl { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 25%; min-width: 0; background: none; border: 0; padding: 0; color: #fff; font: inherit; cursor: pointer; }
.pl .pn { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
.pl .ps { font-size: 11px; color: #F4D88A; font-weight: 700; }
.pl .cap { position: absolute; top: -4px; right: 14%; z-index: 2; background: #E7C26A; color: #2A1E05; font-size: 11px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.pl.empty { opacity: 0.45; cursor: default; }
.pl .ghost { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.15); display: grid; place-items: center; font-size: 22px; }
.linkbox { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(124,200,207,0.12); border: 1px solid var(--aqua); }
.bestbadge { margin: 0; padding: 8px 14px; background: var(--grad-gold); color: #2A1E05; font-weight: 800; font-size: 14px; }
.mcap { margin: 0 0 2px; font-weight: 700; font-size: 17px; }
.reacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.react { border: 1px solid var(--line-2); background: rgba(255,255,255,0.05); color: var(--ink); border-radius: 999px; padding: 7px 12px; font-size: 15px; font-weight: 700; min-height: 38px; }
.react.on { background: rgba(231,194,106,0.22); border-color: #E7C26A; }
.momprev { width: 100%; border-radius: 14px; margin: 10px 0; }
.lbname { text-align: left; flex: 1; }

.gmodes { display: grid; gap: 10px; margin-top: 12px; }
.gm { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: auto auto auto; column-gap: 12px; text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(255,255,255,0.05); color: var(--ink); font-family: var(--f-display); }
.gm:disabled { opacity: 0.45; }
.gme { grid-row: 1 / 4; font-size: 38px; align-self: center; text-align: center; }
.gmt { font-weight: 800; font-size: 18px; }
.gmd { font-size: 13px; color: var(--muted); font-weight: 500; }
.gmb { font-size: 13px; color: #E7C26A; font-weight: 700; margin-top: 2px; }
.gmode { margin: 2px 0 0; font-size: 13px; font-weight: 700; color: #E7C26A; }
.qzq { font-size: 20px; line-height: 1.4; margin: 8px 0 12px; }
.okline { color: #7BD389; font-weight: 700; }
.lboard { display: flex; flex-direction: column; margin-top: 10px; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow.mine { background: rgba(231,194,106,0.12); border-radius: 10px; }
.lrk { width: 30px; text-align: center; font-weight: 800; font-size: 18px; }
.lmid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ltot { font-weight: 800; font-size: 20px; color: #E7C26A; }
.pzwrap { position: relative; width: min(340px, 100%); margin: 12px auto; }
.pzb { position: relative; width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: #0C1A22; border: 3px solid #E7C26A; }
.pzt { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.5); transition: transform 0.15s ease; background-color: #2B5666; cursor: pointer; }
.pzt span { position: absolute; left: 4px; top: 2px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }
.pzpeek { position: absolute; inset: 0; border-radius: 14px; background-size: cover; background-position: center; border: 3px solid #E7C26A; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.pzpeek.on { opacity: 1; }

.mmg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.mmc { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; border: 2px solid #E7C26A; background: linear-gradient(160deg, #1E4F63, #173A4C); padding: 0; overflow: hidden; perspective: 600px; }
.mmb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; opacity: 0.9; }
.mmf { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #14232C; opacity: 0; transition: opacity 0.18s; padding: 4px; }
.mmf b { font-size: 11px; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mmc.up .mmf { opacity: 1; }
.mmc.done { border-color: #2E8B57; box-shadow: 0 0 12px rgba(46,139,87,0.5); }
.shcv { aspect-ratio: 4 / 3; height: auto; width: 100%; max-width: 100%; touch-action: manipulation; }
.kits { display: flex; gap: 10px; margin: 8px 0 14px; }
.kit { width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
.kit.on { border-color: #E7C26A; box-shadow: 0 0 0 3px rgba(231,194,106,0.45); }
.hlrow { display: flex; align-items: center; justify-content: space-around; gap: 6px; margin: 12px 0; }
.hls { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.hls b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hlv { font-size: 40px; font-weight: 800; color: #F6DD8E; font-family: var(--f-display); line-height: 1; }

.sqg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.sqt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px; border: 2px solid var(--line-2); background: rgba(255,255,255,0.05); color: var(--ink); font-family: var(--f-display); transition: transform 0.1s, background 0.1s, box-shadow 0.1s; min-width: 0; }
.sqt b { font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sqt.lit { background: rgba(231,194,106,0.45); border-color: #E7C26A; box-shadow: 0 0 24px rgba(231,194,106,0.7); transform: scale(1.06); }

/* ===== SNB CLUB PREMIUM REDESIGN — additive, keeps existing app logic ===== */
:root {
  --bg:#070B12; --bg-deep:#05080D; --surface:#101925; --surface-2:#172333;
  --ink:#F5F7FB; --muted:#A4B0C0; --line:rgba(210,225,245,.12); --line-2:rgba(210,225,245,.22);
  --gold:#F4C96B; --gold-2:#FFE9A8; --aqua:#67D7E8; --lime:#C5F36A;
  --grad-gold:linear-gradient(135deg,#FFF0B8 0%,#F4C96B 48%,#B87B22 100%);
  --grad-aqua:linear-gradient(135deg,#B1F4FF 0%,#67D7E8 55%,#2699B6 100%);
  --shadow:0 18px 55px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.055);
}
html { background:#05080D; }
body {
  padding:clamp(12px,3vw,30px) 14px 56px;
  background:
    radial-gradient(ellipse at 50% -10%,rgba(38,153,182,.22),transparent 44%),
    radial-gradient(ellipse at 100% 24%,rgba(244,201,107,.09),transparent 34%),
    linear-gradient(180deg,#0B1420 0%,#070B12 56%,#05080D 100%);
}
.wrap { max-width:1000px; gap:22px; }
.top {
  position:relative; overflow:hidden; padding:clamp(16px,3vw,28px);
  border:1px solid rgba(244,201,107,.25); border-radius:26px;
  background:linear-gradient(125deg,rgba(19,36,53,.96),rgba(8,15,24,.97) 65%);
  box-shadow:var(--shadow); gap:18px;
}
.top::before {
  content:""; position:absolute; top:0; left:8%; right:8%; height:2px;
  background:linear-gradient(90deg,transparent,#67D7E8,#F4C96B,#67D7E8,transparent);
}
.top::after {
  content:"SNB  •  EST. SYLHET"; position:absolute; right:18px; top:12px;
  color:rgba(244,201,107,.42); font:800 10px/1 'Barlow Condensed',sans-serif;
  letter-spacing:.22em; pointer-events:none;
}
.brand { gap:18px; position:relative; z-index:1; }
.logo { width:clamp(64px,10vw,92px); height:clamp(64px,10vw,92px); padding:5px; border-radius:22px;
  background:linear-gradient(145deg,#172C3C,#070D14); box-shadow:0 0 0 1px rgba(244,201,107,.7),0 8px 26px #0008; }
.city { font-size:13px; letter-spacing:.38em; color:#F4C96B; }
.brand h1 { font-size:clamp(30px,5.2vw,50px); letter-spacing:.025em; line-height:.98; }
.eyebrow { margin-top:8px; font-size:14px; color:#B7C8D6; }
.role { margin-top:18px; }
.tabs { position:relative; z-index:1; padding:5px; border:1px solid rgba(255,255,255,.07); border-radius:15px; background:#050A11A8; }
.tabs .tab { padding:11px 7px; font-size:15px; }
.tabs .tab[aria-selected="true"] { background:linear-gradient(135deg,#FFE7A0,#F4C96B); color:#1B1608; box-shadow:0 5px 18px #F4C96B25; }
.card { border-color:rgba(195,216,237,.13); background:linear-gradient(155deg,rgba(22,34,49,.98),rgba(11,18,28,.98)); box-shadow:var(--shadow); }
.panel { padding:clamp(16px,3vw,26px); gap:18px; }
.btn { background:var(--grad-gold); color:#211806; box-shadow:0 8px 24px #F4C96B22; }
.btn.lime { background:var(--grad-aqua); color:#06171B; box-shadow:0 8px 24px #67D7E822; }
.btn.ghost { border-color:rgba(255,255,255,.17); }
.hero { padding:clamp(20px,4vw,34px); border-radius:24px; min-height:220px;
  background:radial-gradient(ellipse at 85% 0%,#F4C96B20,transparent 38%),radial-gradient(ellipse at 0% 100%,#67D7E81C,transparent 44%),linear-gradient(135deg,#182638,#0B111B 72%);
  border:1px solid #F4C96B42; }
.hero::after { content:"SYLHET NETBREAKERS"; display:block; font:800 clamp(28px,6vw,64px)/.9 'Barlow Condensed',sans-serif; letter-spacing:.07em; color:rgba(255,255,255,.035); position:absolute; right:10px; bottom:8px; pointer-events:none; }
.hero h2 { font-size:clamp(27px,4vw,40px); }
.hero-stats div { background:rgba(2,7,12,.35); border-color:rgba(255,255,255,.1); }
.list { border:1px solid var(--line); }
.lhead { color:#C3D1DF; }
.row { min-height:68px; }
.row.first { background:linear-gradient(90deg,#F4C96B19,transparent 85%); }
.pcard { border-radius:16px; background:linear-gradient(160deg,#1A2A3C,#0E1621); border-color:var(--line); }
.pinfo { padding:13px; }
.install { border-color:#67D7E844; }
.toast { background:var(--grad-gold); }

/* Dream XI: premium broadcast-style squad and pitch */
.dream { position:relative; overflow:hidden; border:1px solid rgba(244,201,107,.28); }
.dream > h2 { font-size:clamp(25px,4vw,34px); letter-spacing:-.02em; }
.dream > h2::before { content:"✦  "; color:var(--gold); }
.dream > p.muted.small:first-of-type { max-width:650px; line-height:1.75; }
.dream .seg { align-self:stretch; display:flex; width:100%; border-radius:13px; background:#050A11; }
.dream .seg button { flex:1; min-width:0; padding:10px 8px; }
.dream .seg button[aria-pressed="true"] { background:var(--grad-gold); color:#211806; }
.dream .pitch {
  isolation:isolate; overflow:hidden; position:relative; gap:0; padding:18px 8px;
  border:2px solid rgba(234,255,237,.7); border-radius:22px;
  background:
    radial-gradient(ellipse at center,transparent 0 18%,rgba(255,255,255,.17) 18.2% 18.6%,transparent 18.8%),
    linear-gradient(90deg,transparent 49.7%,rgba(255,255,255,.35) 49.8% 50.2%,transparent 50.3%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 38px,rgba(0,0,0,.035) 38px 76px),
    linear-gradient(145deg,#137342,#0B512F 48%,#11663A);
  box-shadow:inset 0 0 55px #001E12A8,0 16px 36px #0005;
}
.dream .pitch::before { content:""; position:absolute; inset:9px; border:1px solid rgba(255,255,255,.46); border-radius:12px; pointer-events:none; z-index:-1; }
.dream .pitch::after { content:""; position:absolute; width:42%; height:10%; left:29%; top:0; border:1px solid rgba(255,255,255,.32); border-top:0; border-radius:0 0 50% 50%; pointer-events:none; }
.dream .prow { align-items:flex-start; gap:2px; padding:9px 0; min-height:108px; }
.dream .prow + .prow { margin-top:2px; }
.dream .pl { width:25%; max-width:125px; gap:5px; padding:5px 1px; border-radius:13px; transition:transform .18s,background .18s; }
.dream .pl:not(.empty):hover { transform:translateY(-4px); background:rgba(0,0,0,.18); }
.dream .pl .av { --s:clamp(42px,8vw,66px); width:var(--s); height:var(--s); border-radius:50%; border:2px solid #F7D77C; box-shadow:0 3px 0 #795D24,0 7px 18px #00180C88; overflow:hidden; }
.dream .pl .pn { width:100%; font-size:clamp(10px,2.4vw,13px); line-height:1.25; color:#FFF; }
.dream .pl .ps { padding:2px 7px; border:1px solid #F4D88A55; border-radius:999px; background:#071A11A8; font-size:10px; color:#FFE7A0; }
.dream .pl .cap { top:0; right:calc(50% - 30px); box-shadow:0 2px 8px #0008; border:1px solid #FFF0B8; }
.dream .pl .ghost { width:clamp(42px,8vw,66px); height:clamp(42px,8vw,66px); border-radius:50%; border:1px dashed #FFFFFF80; background:#062E1B88; }
.dream .pl.empty .pn { color:#D1E7D8; }
.dream .btn.lime { min-height:52px; font-size:17px; }
@media (min-width:760px) {
  .dream .pitch { padding:24px 22px; }
  .dream .prow { min-height:126px; padding:12px 0; }
  .dream .pl .pn { font-size:14px; }
  .dream .pl .ps { font-size:11px; }
}
@media (max-width:480px) {
  .top::after { display:none; }
  .brand { gap:13px; }
  .brand h1 { font-size:29px; }
  .dream.panel { padding:14px 11px; }
  .dream .pitch { padding:12px 3px; }
  .dream .prow { min-height:91px; padding:7px 0; }
  .dream .pl { gap:4px; }
  .dream .pl .av { --s:42px; }
  .dream .pl .ghost { width:42px; height:42px; }
  .dream .pl .ps { font-size:9px; padding:2px 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}


/* ---------- SNB platform upgrade: dashboard, navigation and accessibility ---------- */
.wrap { max-width: 1040px; gap: 22px; }
.top { gap: 18px; }
.brand { padding: 8px 0 14px; }
.brand h1 { font-size: clamp(30px, 5vw, 42px); }
.tabs { display:flex; gap:6px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin; padding:0 2px; border-bottom-color:rgba(124,200,207,.18); }
.tab { flex:0 0 auto; min-width: max-content; padding:12px 15px 11px; border-radius:12px 12px 0 0; }
.tab[aria-selected="true"] { background:linear-gradient(180deg,rgba(124,200,207,.12),rgba(124,200,207,.025)); }
.home-hero { position:relative; overflow:hidden; padding:clamp(22px,5vw,42px); border:1px solid rgba(231,194,106,.28); border-radius:24px; background:radial-gradient(ellipse at 95% 0%,rgba(124,200,207,.16),transparent 38%),radial-gradient(ellipse at 0% 100%,rgba(231,194,106,.11),transparent 42%),linear-gradient(135deg,#172432,#0b121a 70%); box-shadow:0 18px 45px #0003; }

.home-kicker { color:var(--gold); font:700 13px/1.3 var(--f-num); letter-spacing:.2em; text-transform:uppercase; }
.home-hero h2 { position:relative; z-index:1; max-width:720px; margin:10px 0 12px; font:800 clamp(34px,6vw,58px)/.98 var(--f-num); letter-spacing:.015em; text-transform:uppercase; }
.home-hero p { position:relative; z-index:1; max-width:600px; color:#b6c4d0; line-height:1.8; }
.home-actions { position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.home-actions .btn { min-width:150px; }
.home-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.home-metric { min-width:0; padding:17px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(145deg,var(--surface),#111922); }
.home-metric .metric-num { display:block; font:800 clamp(28px,4vw,38px)/1 var(--f-num); color:var(--gold); font-variant-numeric:tabular-nums; }
.home-metric .metric-label { display:block; margin-top:7px; color:var(--muted); font-size:13px; }
.home-section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:6px 0 2px; }
.home-section-head h2 { font-size:22px; }
.home-section-head button { border:0; background:none; color:var(--aqua); font-size:13px; font-weight:700; }
.home-two { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:14px; }
.home-panel { min-width:0; padding:20px; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
.home-panel h3 { margin-bottom:12px; font-size:19px; }
.home-player { display:flex; align-items:center; gap:12px; min-width:0; }
.home-player .home-player-info { min-width:0; flex:1; }
.home-player-info strong { display:block; overflow-wrap:anywhere; }
.home-player-info small { display:block; color:var(--muted); }
.home-empty { padding:18px; border:1px dashed var(--line-2); border-radius:14px; color:var(--muted); line-height:1.7; }
.quick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.quick-card { display:flex; flex-direction:column; align-items:flex-start; gap:7px; text-align:left; padding:18px; min-height:112px; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); }
.quick-card:hover { border-color:var(--aqua); transform:translateY(-2px); }
.quick-card .quick-icon { color:var(--gold); font-size:22px; }
.quick-card small { color:var(--muted); }
.power-row { display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); }
.power-row:last-child { border-bottom:0; }
.power-rank { font:800 24px/1 var(--f-num); color:var(--gold); }
.power-score { font:800 23px/1 var(--f-num); color:var(--aqua); }

@media(max-width:680px) {
 body { padding:12px 10px 36px; }

 .city { font-size:12px; }
 .brand h1 { font-size:clamp(25px,7vw,32px); }

 .home-hero h2 { font-size:clamp(34px,10vw,46px); }

@media(prefers-reduced-motion:reduce) { .quick-card:hover { transform:none; } }


/* SNB Tournament Center integration */
.tournament-embed{width:100%;min-width:0;margin:0 auto;overflow:hidden;border:1px solid rgba(231,194,106,.24);border-radius:18px;background:#0b121a;box-shadow:0 16px 42px rgba(0,0,0,.18)}
.tournament-frame{display:block;width:100%;height:1050px;min-height:850px;border:0;background:#0b121a;color-scheme:dark}
@media(max-width:600px){.tournament-embed{border-radius:12px;margin-left:-2px;width:calc(100% + 4px)}.tournament-frame{min-height:900px}}

/* ===== Premium upgrade ===== */
.home-hero{isolation:isolate}
.home-hero:before{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 85% 10%,rgba(103,215,232,.22),transparent 40%),radial-gradient(ellipse at 10% 95%,rgba(244,201,107,.17),transparent 42%);animation:hpGlow 8s ease-in-out infinite}
.hp-shine{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hp-shine:after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);transform:rotate(45deg);animation:hpShine 6s ease-in-out infinite}
.home-hero>*:not(.hp-shine):not(.hp-live){position:relative;z-index:1}
@keyframes hpGlow{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-4%,3%,0) scale(1.08)}}
@keyframes hpShine{0%{left:-60%}100%{left:130%}}
.hp-live{position:absolute;top:16px;right:16px;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(52,211,153,.15);border:1px solid #34D399;color:#34D399;font:800 12px/1 var(--f-num);letter-spacing:.12em}
.hp-live i{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 10px #34D399;animation:hpPulse 1.4s ease-in-out infinite}
@keyframes hpPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.45}}
.home-metric{position:relative;overflow:hidden;--mc:#F4C96B}
.home-metric .metric-num{color:var(--mc)}
.home-metric .metric-ic{display:block;font-size:17px;margin-bottom:8px}
.home-metric .spark{position:absolute;top:14px;right:12px;width:40px;height:20px}
.home-metric:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--mc);transform:scaleX(0);transform-origin:left;transition:transform .6s ease}
.home-metric.show:after{transform:scaleX(1)}
.hp-feat{position:relative;overflow:hidden;padding:18px 20px 16px;border-radius:20px;border:1px solid rgba(244,201,107,.4);background:radial-gradient(ellipse at 100% 0%,rgba(244,201,107,.14),transparent 45%),radial-gradient(ellipse at 0% 100%,rgba(103,215,232,.1),transparent 45%),linear-gradient(145deg,#182330,#0e151d)}
.hp-feat:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#C5F36A,#F4C96B,#67D7E8)}
.hp-feat-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hp-badge{padding:5px 11px;border-radius:999px;background:linear-gradient(135deg,#FFE9A8,#F4C96B,#B87B22);color:#3a2705;font:800 12px/1 var(--f-num);letter-spacing:.1em}
.hp-feat-top small{color:var(--muted)}
.hp-feat-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center;cursor:pointer}
.hp-side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hp-side strong{font-size:15px;overflow-wrap:anywhere}
.hp-q{--s:58px;width:58px;height:58px;border-radius:15px;display:grid;place-items:center;border:1px dashed var(--line-2);color:var(--muted);font:800 24px var(--f-num)}
.hp-score{font:800 42px/1 var(--f-num);color:#F4C96B;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp-tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hp-tag{padding:5px 11px;border-radius:999px;font-size:13px;background:rgba(244,201,107,.1);border:1px solid rgba(244,201,107,.3);color:#F4C96B}
.hp-pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;padding:22px 12px 0;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.hp-pod-col{display:flex;flex-direction:column;align-items:center;min-width:0;cursor:pointer;text-align:center}
.hp-crown{font-size:24px;line-height:1;animation:hpBob 2.6s ease-in-out infinite}
@keyframes hpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hp-pod-col .av{margin-bottom:6px}
.hp-pod-col.r1 .av{--s:74px;box-shadow:0 0 0 3px #F4C96B,0 0 22px rgba(244,201,107,.45)}
.hp-pod-col.r2 .av,.hp-pod-col.r3 .av{--s:58px}
.hp-pod-col.r2 .av{box-shadow:0 0 0 2px #C8D0D9}
.hp-pod-col.r3 .av{box-shadow:0 0 0 2px #C98954}
.hp-pod-col strong{font-size:14px;max-width:100%;overflow-wrap:anywhere}
.hp-pod-ovr{font:800 22px/1.1 var(--f-num)}
.r1 .hp-pod-ovr{color:#F4C96B}.r2 .hp-pod-ovr{color:#C8D0D9}.r3 .hp-pod-ovr{color:#C98954}
.hp-pod-col small{color:var(--muted);font-size:12px;margin-bottom:8px}
.hp-base{width:100%;display:grid;place-items:center;border-radius:12px 12px 0 0;font:800 34px/1 var(--f-num);opacity:.95}
.r1 .hp-base{height:76px;background:linear-gradient(180deg,#FFE9A8,#F4C96B,#B87B22);color:#4a2f06}
.r2 .hp-base{height:56px;background:linear-gradient(180deg,#EEF3F7,#C8D0D9,#8393A3);color:#27313b}
.r3 .hp-base{height:44px;background:linear-gradient(180deg,#F0B48A,#C98954,#9A5A32);color:#3a1d0a}
@media(max-width:480px){.hp-pod{gap:6px;padding:18px 8px 0}.hp-pod-col.r1 .av{--s:48px}.hp-pod-col.r2 .av,.hp-pod-col.r3 .av{--s:58px}.r1 .hp-base{height:60px}.r2 .hp-base{height:44px}.r3 .hp-base{height:36px}.hp-score{font-size:34px}.hp-live{top:10px;right:10px}}
.hp-ring{display:inline-flex;flex:none;padding:3px;border-radius:32px;background:var(--rc);box-shadow:0 0 22px var(--rg)}
.hp-ring .av{box-shadow:0 0 0 3px #121A23}
.hp-ovr{display:flex;flex-direction:column;margin:2px 0}
.hp-ovr b{font:800 52px/.95 var(--f-num);color:var(--rc)}
.hp-ovr span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.hp-form{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hp-form em{font-style:normal;font-size:12px;color:var(--muted);margin-right:4px}
.hp-fd{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:800 12px/1 var(--f-num);color:#06130d}
.hp-fd.W{background:#34D399}.hp-fd.D{background:#F4C96B}.hp-fd.L{background:#F87171}.hp-fd.N{background:rgba(255,255,255,.12);color:var(--muted)}
.hp-chart{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02)}
.hp-chart svg{display:block;width:100%;height:auto}
.hp-share{width:100%;padding:15px 18px;font-size:17px;font-weight:800;border-radius:16px;background:linear-gradient(135deg,#C5F36A,#F4C96B);color:#1d2a05;border:0;box-shadow:0 10px 26px rgba(197,243,106,.25)}
@media(prefers-reduced-motion:reduce){.home-hero:before,.hp-shine:after,.hp-live i,.hp-crown{animation:none}}

/* ===== Round 2 ===== */
.hp-feat-mid{display:flex;align-items:center;justify-content:center;gap:18px;width:100%;padding:4px 0;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}

.hp-lead-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  function fitImg(file, max) {
    return new Promise(function (res, rej) {
      var fr = new FileReader(); fr.onerror = function () { rej(new Error('read')); };
      fr.onload = function () {
        var img = new Image(); img.onerror = function () { rej(new Error('image')); };
        img.onload = function () {
          var sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var q = 0.72, d = c.toDataURL('image/jpeg', q); while (d.length > 600000 && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
          res(d);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  }
  function loginSheet(closeBtn) {
    var g = S.lg;
    var em = h('input', { type: 'email', placeholder: 'ইমেইল', autocomplete: 'username', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', value: g.email });
    var pw = h('input', { type: g.show ? 'text' : 'password', placeholder: 'পাসওয়ার্ড', autocomplete: 'current-password', value: g.pw });
    em.oninput = function () { g.email = em.value; };
    pw.oninput = function () { g.pw = pw.value; };
    var go = function () { g.email = em.value; g.pw = pw.value; emailLogin(); };
    pw.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    var eye = h('button', { type: 'button', class: 'show', onclick: function () { g.email = em.value; g.pw = pw.value; g.show = !g.show; renderSheet(); } }, g.show ? 'লুকান' : 'দেখুন');
    var f = h('div', { class: 'lgform' },
      em, h('div', { class: 'pwrow' }, pw, eye),
      g.err ? h('p', { class: 'err' }, g.err) : null,
      h('button', { class: 'btn', disabled: g.busy, onclick: go }, g.busy ? 'অপেক্ষা করুন...' : 'লগইন'),
      h('button', { class: 'link-btn', onclick: function () { g.email = em.value; resetPw(); } }, 'পাসওয়ার্ড ভুলে গেছেন?'));
    return h('div', null,
      h('div', { class: 'sheet-head' }, h('h2', null, 'অ্যাডমিন লগইন'), closeBtn),
      f, h('p', { class: 'sep muted small' }, 'অথবা'),
      h('button', { class: 'btn ghost', onclick: loginGoogle }, 'Google দিয়ে লগইন'));
  }
  function authMsg(c) {
    if (c === 'auth/invalid-email') return 'ইমেইল ঠিক নয়।';
    if (c === 'auth/too-many-requests') return 'অনেকবার ভুল হয়েছে। একটু পরে চেষ্টা করুন।';
    if (c === 'auth/network-request-failed') return 'ইন্টারনেট নেই।';
    if (c === 'auth/user-disabled') return 'এই অ্যাকাউন্ট বন্ধ করা আছে।';
    if (c === 'auth/operation-not-allowed') return 'Firebase-এ Email/Password লগইন চালু করা নেই। (operation-not-allowed)';
    if (c === 'auth/unauthorized-domain') return 'এই সাইটের ঠিকানা Firebase-এ অনুমোদিত নয়। (unauthorized-domain)';
    if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid') return 'Firebase কনফিগ ভুল। (' + c + ')';
    return 'ইমেইল বা পাসওয়ার্ড ভুল, অথবা এই ইমেইলে পাসওয়ার্ড-অ্যাকাউন্ট খোলা হয়নি। (' + (c || 'unknown') + ')';
  }
  async function emailLogin() {
    var g = S.lg, em = String(g.email || '').trim().toLowerCase();
    if (!em || !g.pw) { g.err = 'ইমেইল ও পাসওয়ার্ড দিন।'; renderSheet(); return; }
    g.busy = true; g.err = ''; renderSheet();
    try { await S.auth.signInWithEmailAndPassword(em, g.pw); g.pw = ''; }
    catch (e) { g.busy = false; g.err = authMsg(e && e.code); if (S.sheet && S.sheet.mode === 'login') renderSheet(); }
  }
  async function resetPw() {
    var em = String(S.lg.email || '').trim().toLowerCase();
    if (!em) { S.lg.err = 'আগে ইমেইল লিখুন।'; renderSheet(); return; }
    try { await S.auth.sendPasswordResetEmail(em); } catch (e) { /* same message either way */ }
    S.lg.err = ''; toast('ইমেইল থাকলে রিসেট লিংক পাঠানো হয়েছে।');
  }
  async function loginGoogle() {
    var provider = new firebase.auth.GoogleAuthProvider();
    try { await S.auth.signInWithPopup(provider); }
    catch (e) {
      var c = e && e.code;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { S.auth.signInWithRedirect(provider); return; }
      if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      console.error(e);
      toast(isStandalone() ? 'লগইন হয়নি। সাধারণ ব্রাউজারে লিংক খুলে লগইন করুন।' : 'লগইন হয়নি, আবার চেষ্টা করুন।');
    }
  }
  function logout() { S.auth.signOut(); }
  async function init() {
    $('#logo').src = LOGO;
    readHashMoment();
    window.addEventListener('hashchange', function () { if (readHashMoment()) { renderTabs(); renderView(); } });
    renderHeader(); renderTabs(); renderView(); renderInstall();
    var cfg = window.NB_CONFIG && window.NB_CONFIG.firebase;
    if (!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).indexOf('PASTE') === 0) {
      S.noDb = true; S.setup = true; renderHeader(); renderView(); return;
    }
    firebase.initializeApp(cfg);
    S.db = firebase.firestore();
    try { S.db.settings({ experimentalForceLongPolling: true, useFetchStreams: false, merge: true }); } catch (e) { /* ignore */ }
    try { await S.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* cache unavailable, fine */ }
    S.auth = firebase.auth();
    if (S.mom.focus) readHashMoment();
    listen();
    listenAC();
    S.auth.onAuthStateChanged(async function (u) {
      S.user = u; S.canWrite = false;
      if (u && u.email) {
        try { var a = await S.db.doc('admins/' + u.email.toLowerCase()).get(); S.canWrite = a.exists; } catch (e) { S.canWrite = false; }
        if (!S.canWrite) toast('এই ইমেইল অ্যাডমিন তালিকায় নেই।');
        else if (S.sheet && S.sheet.mode === 'login') closeSheet();
      }
      refresh();
    });
  }
  init();
})();
</script>
</body>
</html>
